<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletic & Toned PPL Tracker</title>
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ec4899">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf2f8', 100: '#fce7f3', 500: '#ec4899', 600: '#db2777', 700: '#be185d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 px-4 py-3 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold text-pink-400 flex items-center gap-2">
                <i class="fa-solid fa-dumbbell"></i> Toned & Athletic PPL
            </h1>
            <p class="text-xs text-gray-400">5'2" | 56 kg | 6-Day 2-Hour Routine</p>
        </div>
        <button id="installBtn" class="hidden bg-pink-600 hover:bg-pink-700 text-white text-xs px-3 py-1.5 rounded-full font-medium transition shadow">
            <i class="fa-solid fa-download mr-1"></i> Install App
        </button>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-gray-900 border-b border-gray-800 flex justify-around p-2 text-xs font-medium text-gray-400 sticky top-[57px] z-40 backdrop-blur bg-opacity-90">
        <button onclick="switchTab('workouts')" id="nav-workouts" class="tab-btn flex flex-col items-center py-1.5 px-3 rounded-lg text-pink-400 bg-gray-800 transition">
            <i class="fa-solid fa-clipboard-list text-base mb-0.5"></i> Workouts
        </button>
        <button onclick="switchTab('timer')" id="nav-timer" class="tab-btn flex flex-col items-center py-1.5 px-3 rounded-lg hover:text-white transition">
            <i class="fa-solid fa-stopwatch text-base mb-0.5"></i> Session & Rest
        </button>
        <button onclick="switchTab('nutrition')" id="nav-nutrition" class="tab-btn flex flex-col items-center py-1.5 px-3 rounded-lg hover:text-white transition">
            <i class="fa-solid fa-utensils text-base mb-0.5"></i> Macros & Fasting
        </button>
        <button onclick="switchTab('setup')" id="nav-setup" class="tab-btn flex flex-col items-center py-1.5 px-3 rounded-lg hover:text-white transition">
            <i class="fa-solid fa-info-circle text-base mb-0.5"></i> Guide
        </button>
    </nav>
